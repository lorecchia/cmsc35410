<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageRank by power iteration</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="wrap">
  <div class="controls">
    <span class="seg" id="graphSeg">
      <button data-g="0" class="on">Well-mixed web</button>
      <button data-g="1">Two communities</button>
    </span>
    <label>α <input type="range" id="alpha" min="0.5" max="0.99" step="0.01" value="0.85"><span class="val" id="alphaVal"></span></label>
    <button id="step">Step</button>
    <button id="run" class="primary">Run</button>
    <button id="reset">Reset</button>
  </div>
  <div class="panels">
    <div class="panel">
      <h3>Web graph — node area ∝ π<sub>k</sub>(page)</h3>
      <svg id="graph" viewBox="0 0 480 420"></svg>
    </div>
    <div class="panel">
      <h3>Current iterate π<sub>k</sub> (ticks: true π)</h3>
      <svg id="bars" viewBox="0 0 480 170"></svg>
      <h3>Error ‖π<sub>k</sub> − π‖<sub>1</sub> (log scale)</h3>
      <svg id="err" viewBox="0 0 480 220"></svg>
    </div>
  </div>
  <div class="readout" id="readout"></div>
</div>
<script src="lib.js"></script>
<script>
// ---------- graphs ----------
const R = 150, CX = 240, CY = 210;
const circ = (i, n) => [CX + R * Math.cos(-Math.PI / 2 + 2 * Math.PI * i / n), CY + R * Math.sin(-Math.PI / 2 + 2 * Math.PI * i / n)];
const GRAPHS = [
  { name: "Well-mixed web",
    pos: [...Array(8).keys()].map(i => circ(i, 8)),
    edges: [[0,1],[0,4],[0,6],[1,2],[1,5],[2,3],[2,6],[2,0],[3,4],[3,7],[4,5],[4,1],[5,6],[5,2],[6,7],[6,3],[7,0],[7,4],[1,7],[5,0]] },
  { name: "Two communities",
    pos: [[70,110],[190,80],[190,200],[80,250],[300,170],[410,140],[420,280],[300,310]].map(([x,y]) => [x, y + 20]),
    edges: [[0,1],[1,0],[1,2],[2,1],[2,3],[3,0],[0,2],[3,1],[2,0],
            [4,5],[5,4],[5,6],[6,5],[6,7],[7,4],[4,6],[7,5],[6,4],
            [2,4],[7,3]] },
];
const N = 8;

function transition(g) {           // row-stochastic P (all nodes have out-links)
  const P = Array.from({ length: N }, () => Array(N).fill(0));
  const out = Array(N).fill(0);
  g.edges.forEach(([i]) => out[i]++);
  g.edges.forEach(([i, j]) => P[i][j] += 1 / out[i]);
  return P;
}
function stepM(pi, P, a) {        // π^T M = α π^T P + (1-α)/n 1^T
  const nxt = Array(N).fill((1 - a) / N);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) nxt[j] += a * pi[i] * P[i][j];
  return nxt;
}
function stationary(P, a) {
  let pi = Array(N).fill(1 / N);
  for (let k = 0; k < 5000; k++) pi = stepM(pi, P, a);
  return pi;
}
function errCurve(P, a, piStar, K) {
  let pi = Array(N).fill(0); pi[0] = 1;
  const out = [];
  for (let k = 0; k <= K; k++) { out.push(l1(pi, piStar)); pi = stepM(pi, P, a); }
  return out;
}
const l1 = (x, y) => x.reduce((s, xi, i) => s + Math.abs(xi - y[i]), 0);

// ---------- state ----------
let gi = 0, alpha = 0.85, pi, piStar, P, k, errs, timer = null;
const KMAX = 80;
function reset() {
  P = transition(GRAPHS[gi]);
  piStar = stationary(P, alpha);
  pi = Array(N).fill(0); pi[0] = 1;     // surfer starts on page 0
  k = 0; errs = [l1(pi, piStar)];
  render();
}
function step() {
  if (k >= KMAX) { stop(); return; }
  pi = stepM(pi, P, alpha); k++; errs.push(l1(pi, piStar)); render();
}
function stop() { clearInterval(timer); timer = null; document.getElementById("run").textContent = "Run"; }

// ---------- rendering ----------
const gsvg = document.getElementById("graph"), bsvg = document.getElementById("bars"), esvg = document.getElementById("err");
function rad(p) { return 9 + 70 * Math.sqrt(p); }

function renderGraph() {
  gsvg.innerHTML = "";
  const defs = el("defs", {}, gsvg);
  const m = el("marker", { id: "arr", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", fill: "#8a857b" }, m);
  const g = GRAPHS[gi];
  for (const [i, j] of g.edges) {
    const [x1, y1] = g.pos[i], [x2, y2] = g.pos[j];
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const bend = 14, mx = (x1 + x2) / 2 - uy * bend, my = (y1 + y2) / 2 + ux * bend;
    const r1 = rad(pi[i]) + 2, r2 = rad(pi[j]) + 4;
    const sx = x1 + (mx - x1) / Math.hypot(mx - x1, my - y1) * r1, sy = y1 + (my - y1) / Math.hypot(mx - x1, my - y1) * r1;
    const ex = x2 + (mx - x2) / Math.hypot(mx - x2, my - y2) * r2, ey = y2 + (my - y2) / Math.hypot(mx - x2, my - y2) * r2;
    el("path", { d: `M${sx},${sy} Q${mx},${my} ${ex},${ey}`, fill: "none", class: "edge", "stroke-width": 1.3, "marker-end": "url(#arr)" }, gsvg);
  }
  g.pos.forEach(([x, y], i) => {
    el("circle", { cx: x, cy: y, r: rad(piStar[i]), fill: "none", stroke: "#2563eb", "stroke-dasharray": "3 3", "stroke-width": 1 }, gsvg);
    el("circle", { cx: x, cy: y, r: rad(pi[i]), fill: "#2563eb", "fill-opacity": 0.85, stroke: "#1e40af" }, gsvg);
    const t = el("text", { x, y: y + 4, "text-anchor": "middle", fill: "#fff", "font-size": 12, "font-weight": 600 }, gsvg);
    t.textContent = i;
  });
  const cap = el("text", { x: 10, y: 412, class: "tick" }, gsvg);
  cap.textContent = "dashed rings: stationary π   ·   surfer starts on page 0";
}

function renderBars() {
  bsvg.innerHTML = "";
  const x0 = 34, w = 480 - x0 - 8, h = 130, y0 = 145, maxv = 0.5;
  el("line", { x1: x0, x2: x0 + w, y1: y0, y2: y0, class: "axis" }, bsvg);
  [0, 0.25, 0.5].forEach(v => {
    const y = y0 - v / maxv * h;
    el("line", { x1: x0, x2: x0 + w, y1: y, y2: y, stroke: "#eee" }, bsvg);
    el("text", { x: x0 - 5, y: y + 4, "text-anchor": "end", class: "tick" }, bsvg).textContent = v;
  });
  const bw = w / N;
  for (let i = 0; i < N; i++) {
    const v = Math.min(pi[i], maxv), bx = x0 + i * bw + bw * 0.18;
    el("rect", { x: bx, y: y0 - v / maxv * h, width: bw * 0.64, height: v / maxv * h, fill: "#2563eb", rx: 2 }, bsvg);
    const ys = y0 - piStar[i] / maxv * h;
    el("line", { x1: bx - 4, x2: bx + bw * 0.64 + 4, y1: ys, y2: ys, stroke: "#ea580c", "stroke-width": 2.5 }, bsvg);
    el("text", { x: bx + bw * 0.32, y: y0 + 16, "text-anchor": "middle", class: "tick" }, bsvg).textContent = i;
  }
}

function renderErr() {
  esvg.innerHTML = "";
  const x0 = 44, w = 480 - x0 - 10, y0 = 190, h = 175, lo = -12, hi = 0.5;
  const X = kk => x0 + kk / KMAX * w, Y = e => y0 - (Math.log10(Math.max(e, 1e-12)) - lo) / (hi - lo) * h;
  for (let d = lo; d <= 0; d += 3) {
    el("line", { x1: x0, x2: x0 + w, y1: Y(10 ** d), y2: Y(10 ** d), stroke: "#eee" }, esvg);
    el("text", { x: x0 - 5, y: Y(10 ** d) + 4, "text-anchor": "end", class: "tick" }, esvg).textContent = "1e" + d;
  }
  [0, 20, 40, 60, 80].forEach(kk => el("text", { x: X(kk), y: y0 + 15, "text-anchor": "middle", class: "tick" }, esvg).textContent = kk);
  el("line", { x1: x0, x2: x0 + w, y1: y0, y2: y0, class: "axis" }, esvg);
  el("text", { x: x0 + w, y: y0 + 28, "text-anchor": "end", class: "tick" }, esvg).textContent = "iteration k";

  const path = arr => arr.map((e, i) => `${i ? "L" : "M"}${X(i)},${Y(e)}`).join(" ");
  // reference α^k (scaled to start at err_0) — the guaranteed rate since |λ2(M)| ≤ α
  const ref = [...Array(KMAX + 1).keys()].map(kk => errs[0] * alpha ** kk);
  el("path", { d: path(ref), fill: "none", stroke: "#8a857b", "stroke-dasharray": "5 4", "stroke-width": 1.2 }, esvg);
  // the other graph, same α, for comparison
  const og = 1 - gi, oP = transition(GRAPHS[og]);
  const other = errCurve(oP, alpha, stationary(oP, alpha), KMAX);
  el("path", { d: path(other), fill: "none", stroke: "#ea580c", "stroke-opacity": 0.45, "stroke-width": 2 }, esvg);
  el("path", { d: path(errs), fill: "none", stroke: "#2563eb", "stroke-width": 2.5 }, esvg);
  // legend
  const lg = [["#2563eb", 1, "this graph"], ["#ea580c", 0.45, GRAPHS[og].name.toLowerCase()], ["#8a857b", 1, "αᵏ  (bound: |λ₂(M)| ≤ α)"]];
  lg.forEach(([c, o, t], i) => {
    const ly = 18 + i * 16;
    el("line", { x1: x0 + w - 190, x2: x0 + w - 170, y1: ly, y2: ly, stroke: c, "stroke-opacity": o, "stroke-width": 2.5, "stroke-dasharray": i === 2 ? "5 4" : "" }, esvg);
    el("text", { x: x0 + w - 164, y: ly + 4, class: "tick" }, esvg).textContent = t;
  });
}

function render() {
  renderGraph(); renderBars(); renderErr();
  document.getElementById("alphaVal").textContent = alpha.toFixed(2);
  document.getElementById("readout").innerHTML =
    `k = <b>${k}</b> &nbsp;·&nbsp; ‖π<sub>k</sub> − π‖<sub>1</sub> = <b>${fmt(errs[errs.length - 1])}</b> &nbsp;·&nbsp; ` +
    `top page: <b>${piStar.indexOf(Math.max(...piStar))}</b> (π = ${fmt(Math.max(...piStar))})`;
}

// ---------- wiring ----------
document.querySelectorAll("#graphSeg button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#graphSeg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); gi = +b.dataset.g; stop(); reset();
});
document.getElementById("alpha").oninput = e => { alpha = +e.target.value; stop(); reset(); };
document.getElementById("step").onclick = () => { stop(); step(); };
document.getElementById("reset").onclick = () => { stop(); reset(); };
document.getElementById("run").onclick = e => {
  if (timer) { stop(); return; }
  if (k >= KMAX) reset();
  e.target.textContent = "Pause";
  timer = setInterval(step, 180);
};
reset();
</script>
</body>
</html>
