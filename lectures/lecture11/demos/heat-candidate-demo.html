<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The heat kernel as a candidate for SDP(b) — interactive demo</title>
<style>
  :root { --blue:#2563eb; --orange:#ea580c; --green:#15803d; --red:#c0392b; --grey:#8a857b; --ink:#1c1b19; }
  html,body { margin:0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:#fff; font-size:14px; }
  .wrap { padding:8px 12px; }
  .controls { display:flex; flex-wrap:wrap; gap:18px; align-items:center; margin-bottom:8px; }
  .controls label { font-weight:600; margin-right:6px; }
  select, input[type=range] { vertical-align:middle; }
  .val { font-family: ui-monospace, Menlo, monospace; min-width:4.5em; display:inline-block; }
  .grid { display:grid; grid-template-columns: 1.2fr 1fr 0.95fr; gap:10px; }
  .panel { border:1px solid #e3e3e3; border-radius:8px; padding:6px 8px; }
  .panel h4 { margin:2px 0 4px; font-size:13px; color:#444; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td { padding:3px 4px; border-bottom:1px solid #f0f0f0; vertical-align:top; }
  td.num { text-align:right; font-family: ui-monospace, Menlo, monospace; white-space:nowrap; }
  .ok { color:var(--green); font-weight:700; }
  .bad { color:var(--red); font-weight:700; }
  .verdict { margin-top:6px; padding:5px 7px; border-radius:6px; font-size:13px; }
  .verdict.ok { background:#eef7f0; color:var(--green); }
  .verdict.bad { background:#fdeeee; color:var(--red); }
  .verdict.oracle { background:#f4f2ee; color:var(--ink); }
  .legend { font-size:12px; color:#555; margin-top:2px; }
  .legend span { margin-right:12px; white-space:nowrap; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:middle; margin-right:4px; }
  .note { color:#666; font-size:12px; margin-top:4px; }
  svg text { font-size:11px; fill:#444; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <span><label for="graph">Graph</label><select id="graph"></select></span>
    <span><label for="gamma">γ</label><input id="gamma" type="range" min="-2" max="0" step="0.05" value="-1.7"> <span class="val" id="gammaVal"></span></span>
    <span><label for="b">b</label>
      <select id="b">
        <option value="0.5">1/2</option>
        <option value="0.25" selected>1/4</option>
        <option value="0.125">1/8</option>
      </select></span>
    <span><label for="c">heavy: ‖v<sub>i</sub>‖² ≥ c/b, c =</label>
      <select id="c">
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="16" selected>16 (lecture)</option>
      </select></span>
    <span class="val" id="tauVal" style="min-width:10em"></span>
  </div>

  <div class="grid">
    <div class="panel">
      <h4>The embedding: vertex i shaded by ‖v<sub>i</sub>‖²</h4>
      <svg id="g" width="100%" viewBox="0 0 400 290"></svg>
      <div class="legend">
        <span><span class="sw" style="background:#e7e4dc"></span>‖v<sub>i</sub>‖² ≈ 0</span>
        <span><span class="sw" style="background:var(--blue)"></span>light, ‖v<sub>i</sub>‖² close to c/b</span>
        <span><span class="sw" style="background:#7f1d1d"></span>heavy, ‖v<sub>i</sub>‖² ≥ c/b</span>
      </div>
    </div>
    <div class="panel">
      <h4>Where the variance sits: ‖v<sub>i</sub>‖² sorted, bar width π<sub>i</sub></h4>
      <svg id="prof" width="100%" viewBox="0 0 330 290"></svg>
      <div class="note">Total shaded area = Σ<sub>i</sub> π<sub>i</sub>‖v<sub>i</sub>‖² = tr Y = 1. Dark red area = variance on the heavy set H.</div>
    </div>
    <div class="panel">
      <h4>Is Y feasible for SDP(b) ≤ γ?</h4>
      <table id="tbl"></table>
      <div id="verdict" class="verdict"></div>
      <div id="oracle" class="verdict oracle"></div>
    </div>
  </div>
</div>

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function text(parent, x, y, s, attrs = {}) { const t = el("text", { x, y, ...attrs }, parent); t.textContent = s; return t; }
function mix(c1, c2, t) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const a = p(c1), b = p(c2);
  t = Math.max(0, Math.min(1, t)); return "rgb(" + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(",") + ")";
}
const fmt = (x, d = 3) => x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toPrecision(d);
const pct = x => (100 * x).toFixed(x < 0.1 ? 1 : 0) + "%";

DATA.forEach((G, i) => { const o = document.createElement("option"); o.value = i; o.textContent = G.label; $("graph").appendChild(o); });

// Y = e^{-tau NL}/tr on sqrt(pi)^perp:  ||v_i||^2 = sum_k w_k q_k(i) / sum_k w_k,  energy = sum_k lam_k w_k / sum_k w_k
function heat(G, tau) {
  const w = G.lam.map(l => Math.exp(-tau * (l - G.lam[0]))), Z = w.reduce((s, x) => s + x, 0);
  const energy = G.lam.reduce((s, l, k) => s + l * w[k], 0) / Z;
  const norms = new Float64Array(G.n);
  G.q.forEach((row, k) => { const c = w[k] / Z; if (c > 1e-14) for (let i = 0; i < G.n; i++) norms[i] += c * row[i]; });
  const tr = norms.reduce((s, x, i) => s + G.pi[i] * x, 0);   // = 1 up to the 3-digit rounding of q
  for (let i = 0; i < G.n; i++) norms[i] /= tr;
  return { energy, norms };
}

function drawGraph(G, norms, b, c) {
  const svg = $("g"); svg.innerHTML = "";
  const W = 400, H = 290, m = 12, xs = G.xy.map(p => p[0]), ys = G.xy.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min((W - 2 * m) / (x1 - x0 || 1), (H - 2 * m) / (y1 - y0 || 1));
  const ox = (W - s * (x1 - x0)) / 2, oy = (H - s * (y1 - y0)) / 2;
  const X = i => ox + s * (G.xy[i][0] - x0), Y = i => oy + s * (y1 - G.xy[i][1]);
  const ge = el("g", { stroke: "#d6d1c7", "stroke-width": 0.6 }, svg);
  for (const [u, v] of G.edges) el("line", { x1: X(u), y1: Y(u), x2: X(v), y2: Y(v) }, ge);
  const r = G.n > 200 ? 2.6 : 3.2;
  const order = [...Array(G.n).keys()].sort((i, j) => norms[i] - norms[j]);   // heavy vertices drawn last
  for (const i of order) {
    const t = norms[i] * b / c, heavy = t >= 1;
    el("circle", { cx: X(i), cy: Y(i), r: heavy ? r + 1 : r, fill: heavy ? "#7f1d1d" : mix("#e7e4dc", "#2563eb", Math.sqrt(t)) }, svg);
  }
}

function drawProfile(G, norms, b, c) {
  const svg = $("prof"); svg.innerHTML = "";
  const W = 330, H = 290, L = 40, R = 10, T = 12, B = 34, pw = W - L - R, ph = H - T - B;
  const ymax = 1.08 * Math.max(Math.max(...norms), 1 / b, 1.5);
  const sx = x => L + pw * x, sy = y => T + ph * (1 - y / ymax);
  const order = [...Array(G.n).keys()].sort((i, j) => norms[j] - norms[i]);
  let x = 0, dHeavy = "", dLight = "";
  for (const i of order) {
    const seg = `M${sx(x)},${sy(0)}V${sy(norms[i])}H${sx(x + G.pi[i])}V${sy(0)}Z`;
    if (norms[i] * b >= c) dHeavy += seg; else dLight += seg; x += G.pi[i];
  }
  el("path", { d: dLight, fill: "#93b4f5", stroke: "#2563eb", "stroke-width": 0.3 }, svg);
  el("path", { d: dHeavy, fill: "#b45353", stroke: "#7f1d1d", "stroke-width": 0.3 }, svg);
  // axes
  el("line", { x1: L, y1: sy(0), x2: L + pw, y2: sy(0), stroke: "#888" }, svg);
  el("line", { x1: L, y1: T, x2: L, y2: sy(0), stroke: "#888" }, svg);
  for (const t of [0, 0.25, 0.5, 0.75, 1]) { el("line", { x1: sx(t), y1: sy(0), x2: sx(t), y2: sy(0) + 4, stroke: "#888" }, svg); text(svg, sx(t), sy(0) + 15, t, { "text-anchor": "middle" }); }
  text(svg, L + pw / 2, H - 4, "cumulative volume π (heaviest vertices first)", { "text-anchor": "middle" });
  const step = [1, 2, 5, 10, 20, 50, 100].find(s => ymax / s <= 6);
  for (let y = 0; y <= ymax; y += step) text(svg, L - 5, sy(y) + 4, y, { "text-anchor": "end" });
  // reference lines
  el("line", { x1: L, y1: sy(1 / b), x2: L + pw, y2: sy(1 / b), stroke: "#c0392b", "stroke-width": 1.4, "stroke-dasharray": "5 3" }, svg);
  text(svg, L + pw - 2, sy(1 / b) - 4, "1/b = " + (1 / b), { "text-anchor": "end", style: "fill:#c0392b;font-weight:600" });
  if (c / b <= ymax) {
    el("line", { x1: L, y1: sy(c / b), x2: L + pw, y2: sy(c / b), stroke: "#7f1d1d", "stroke-width": 1.4 }, svg);
    text(svg, L + pw - 2, sy(c / b) - 4, "c/b = " + (c / b) + " (heavy)", { "text-anchor": "end", style: "fill:#7f1d1d;font-weight:600" });
  } else text(svg, L + pw - 2, T + 8, "c/b = " + (c / b) + " (heavy): off scale ↑", { "text-anchor": "end", style: "fill:#7f1d1d" });
  el("line", { x1: L, y1: sy(1), x2: L + pw, y2: sy(1), stroke: "#555", "stroke-width": 1, "stroke-dasharray": "1 3" }, svg);
  text(svg, L + 0.6 * pw, sy(1) - 4, "average 1", { "text-anchor": "middle" });
}

function update() {
  const G = DATA[+$("graph").value], gamma = Math.pow(10, +$("gamma").value), b = +$("b").value, c = +$("c").value;
  const tau = 8 * Math.log(G.n) / gamma, { energy, norms } = heat(G, tau);
  $("gammaVal").textContent = gamma.toPrecision(2);
  $("tauVal").textContent = "τ₀ = 8 ln n/γ = " + tau.toFixed(0);
  drawGraph(G, norms, b, c); drawProfile(G, norms, b, c);
  let mx = 0, mean = 0, volH = 0, varH = 0;
  for (let i = 0; i < G.n; i++) {
    const v = G.pi[i] * norms[i]; mx = Math.max(mx, norms[i]); mean += v;
    if (norms[i] * b >= c) { volH += G.pi[i]; varH += v; }
  }
  const okE = energy <= gamma, okS = mx <= 1 / b, mark = ok => ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>';
  $("tbl").innerHTML = `
    <tr><td>n, λ₂</td><td class="num">${G.n}, ${fmt(G.lam[0])}</td><td></td></tr>
    <tr><td>Σ π<sub>i</sub>v<sub>i</sub> = 0 <span style="color:#888">(Y on W)</span></td><td class="num">built in</td><td>${mark(true)}</td></tr>
    <tr><td>Σ π<sub>i</sub>‖v<sub>i</sub>‖² = 1 <span style="color:#888">(tr Y = 1)</span></td><td class="num">${mean.toFixed(3)}</td><td>${mark(true)}</td></tr>
    <tr><td>energy ⟨𝓛,Y⟩ ≤ γ = ${gamma.toPrecision(2)}</td><td class="num">${fmt(energy)}</td><td>${mark(okE)}</td></tr>
    <tr><td>max<sub>i</sub> ‖v<sub>i</sub>‖² ≤ 1/b = ${1 / b}</td><td class="num">${fmt(mx)}</td><td>${mark(okS)}</td></tr>
    <tr><td>heavy H: vol, var</td><td class="num">${pct(volH)}, ${pct(varH)}</td><td></td></tr>
    <tr><td>light L = V∖H: var</td><td class="num">${pct(1 - varH)}</td><td></td></tr>`;
  const v = $("verdict");
  if (okE && okS) { v.className = "verdict ok"; v.innerHTML = "Feasible: the heat kernel is a witness for SDP(b) ≤ γ."; }
  else if (!okE && gamma < G.lam[0]) { v.className = "verdict bad"; v.innerHTML = `Energy too high, and no Y can do better: every play on W has ⟨𝓛,Y⟩ ≥ λ₂ = ${fmt(G.lam[0])} &gt; γ.`; }
  else if (!okE) { v.className = "verdict bad"; v.innerHTML = "Energy too high at this τ₀."; }
  else { v.className = "verdict bad"; v.innerHTML = `Low energy, but not spread: max ‖v<sub>i</sub>‖² = ${fmt(mx)} &gt; 1/b.`; }
  $("oracle").innerHTML = "<b>Oracle (§1):</b> " + (!okE ? "(a) energy ≥ γ: <b>certify</b>."
    : varH >= 0.5 ? "(b) heavy share ≥ ½: <b>penalize</b> H."
    : "(c) light share &gt; ½: <b>round</b>.");
}
["graph", "gamma", "b", "c"].forEach(id => $(id).addEventListener("input", update));
update();
</script>
</body>
</html>
