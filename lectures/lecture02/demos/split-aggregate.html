<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measures vs densities: split and aggregate</title>
<link rel="stylesheet" href="demo.css">
<style>
  .red { color: #dc2626; } .blue { color: #2563eb; }
  .eq { font-size: 15px; margin: 2px 4px 0; }
  .eq b { font-weight: 600; }
  #loop .st { cursor: default; }
  .small { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <span class="seg" id="modeSeg">
      <button data-m="mu" class="on">Measures &nbsp;μ<sup>⊤</sup> ↦ μ<sup>⊤</sup>D<sup>−1</sup>A</button>
      <button data-m="x">Densities &nbsp;x ↦ D<sup>−1</sup>A x</button>
    </span>
    <button id="next" class="primary">Next move ▸</button>
    <button id="full">Full step</button>
    <button id="run">Run</button>
    <button id="reset">Reset</button>
    <label>start
      <select id="init">
        <option value="fig">figure values</option>
        <option value="v1">point mass at v₁</option>
        <option value="v3">point mass at v₃</option>
      </select>
    </label>
  </div>
  <div class="panels">
    <div class="panel">
      <h3 id="gtitle"></h3>
      <svg id="graph" viewBox="0 10 440 305"></svg>
      <div class="eq" id="moveText"></div>
    </div>
    <div class="panel">
      <h3>One loop, two places to stand</h3>
      <svg id="loop" viewBox="0 0 480 150"></svg>
      <h3 id="barTitle">Converging: <span class="red">μ<sub>t</sub> → π ∝ degree</span> &nbsp;·&nbsp; <span class="blue">x<sub>t</sub> = D<sup>−1</sup>μ<sub>t</sub> → constant 1/vol(V)</span></h3>
      <svg id="bars" viewBox="0 0 480 170"></svg>
    </div>
  </div>
  <div class="readout" id="readout"></div>
</div>
<script src="lib.js"></script>
<script>
// Graph from the figure: v1 - v2, v2 - v3, v2 - v4, v3 - v4.  Degrees (1, 3, 2, 2), vol = 8.
const pos = [[50, 165], [195, 165], [375, 62], [375, 268]];
const DLAB = [[0, 46], [0, 46], [0, -36], [0, 46]];   // where to print the degree
const edges = [[0, 1], [1, 2], [1, 3], [2, 3]];
const n = 4, deg = [1, 3, 2, 2], vol = 8;
const RED = "#dc2626", BLUE = "#2563eb", GREY = "#8a857b";

// The loop has three states, joined by three moves:
//   VERT (mass on vertices) --D^{-1}: split/average--> OWN (value on own edge-ends)
//   OWN --send--> SENT (value carried to the far end) --A: aggregate--> VERT
const STATES = ["VERT", "OWN", "SENT"];
const MOVE_FROM = { VERT: "D", OWN: "send", SENT: "A" };
let mode = "mu", state, t, vertVal, xVal, anim = null, running = false, homeX;

function initVec() {
  const v = document.getElementById("init").value;
  if (v === "fig") return [0.1, 0.2, 0.1, 0.05];            // x as in the figure; mu = D x sums to 1
  const k = v === "v1" ? 0 : 2; const x = [0, 0, 0, 0]; x[k] = 1 / deg[k]; return x;
}
function reset() {
  stop(); t = 0; xVal = initVec(); homeX = xVal.slice();
  if (mode === "mu") { state = "VERT"; vertVal = xVal.map((x, i) => x * deg[i]); }
  else { state = "OWN"; vertVal = null; }
  render();
}
function ends() {   // list of directed edge-ends: [from u, to w]
  const out = []; edges.forEach(([a, b]) => { out.push([a, b]); out.push([b, a]); }); return out;
}
function endPos(u, w, frac) {   // point at fraction frac from u toward w, nudged off the line
  const [x1, y1] = pos[u], [x2, y2] = pos[w];
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  const side = 1;   // the two directions of an edge sit on opposite sides, so they cross during "send"
  return [x1 + dx * frac + 15 * nx * side, y1 + dy * frac + 15 * ny * side];
}
const OWN_F = 0.27, FAR_F = 0.73;

function fmtv(v) { return v === 0 ? "0" : (Math.abs(v - Math.round(v * 1000) / 1000) < 1e-9 ? String(+v.toFixed(3)) : v.toFixed(3)); }

function drawGraph(p = 1) {
  const g = document.getElementById("graph"); g.innerHTML = "";
  edges.forEach(([i, j]) => el("line", { x1: pos[i][0], y1: pos[i][1], x2: pos[j][0], y2: pos[j][1], class: "edge", "stroke-width": 1.6 }, g));
  // vertices
  pos.forEach(([x, y], i) => {
    el("circle", { cx: x, cy: y, r: 27, fill: "#fff", stroke: "#57534e", "stroke-width": 1.4 }, g);
    const lab = el("text", { x: x, y: y - 6, "text-anchor": "middle", "font-size": 15, "font-style": "italic", fill: "#1c1b19" }, g);
    lab.textContent = "v" + "₁₂₃₄"[i];
    el("text", { x: x + DLAB[i][0], y: y + DLAB[i][1], "text-anchor": "middle", "font-size": 12, fill: GREY }, g).textContent = "d = " + deg[i];
  });
  const showVert = anim ? anim.vertShow : vertShowNow();
  if (showVert) showVert.vals.forEach((v, i) => {
    const tx = el("text", { x: pos[i][0], y: pos[i][1] + 13, "text-anchor": "middle", "font-size": 14, "font-weight": 600, fill: showVert.color, opacity: showVert.op ?? 1 }, g);
    tx.textContent = fmtv(v);
  });
  // edge-end labels
  const labs = anim ? anim.labels(p) : labelsNow();
  labs.forEach(L => {
    const tx = el("text", { x: L.x, y: L.y + 5, "text-anchor": "middle", "font-size": 14.5, "font-weight": 600, fill: BLUE, opacity: L.op ?? 1, stroke: "#fff", "stroke-width": 3, "paint-order": "stroke" }, g);
    tx.textContent = fmtv(L.v);
  });
}
function vertShowNow() {
  if (state === "VERT") return { vals: vertVal, color: RED };
  if (mode === "x" && state === "OWN") return { vals: xVal, color: BLUE };
  return null;
}
function labelsNow() {
  if (state === "OWN") return ends().map(([u, w]) => { const [x, y] = endPos(u, w, OWN_F); return { x, y, v: xVal[u] }; });
  if (state === "SENT") return ends().map(([u, w]) => { const [x, y] = endPos(u, w, FAR_F); return { x, y, v: xVal[u] }; });
  return [];
}

function move() {
  if (anim) return;
  const m = MOVE_FROM[state], dur = 750, t0 = performance.now();
  if (m === "D") {   // split (measures) / average (densities): vertex value / degree onto each edge-end
    const newX = vertVal.map((v, i) => v / deg[i]);
    anim = { vertShow: { vals: vertVal, color: RED, op: 0.35 },
      labels: p => ends().map(([u, w]) => { const [x2, y2] = endPos(u, w, OWN_F); return { x: lerp(pos[u][0], x2, p), y: lerp(pos[u][1] + 8, y2, p), v: newX[u], op: p }; }),
      done: () => { xVal = newX; state = "OWN"; if (mode === "x") { t += 1; homeX = xVal.slice(); } } };
  } else if (m === "send") {
    anim = { vertShow: null,
      labels: p => ends().map(([u, w]) => { const [x1, y1] = endPos(u, w, OWN_F), [x2, y2] = endPos(u, w, FAR_F); return { x: lerp(x1, x2, p), y: lerp(y1, y2, p), v: xVal[u] }; }),
      done: () => { state = "SENT"; } };
  } else {           // aggregate: each vertex sums what arrived, A x
    const sum = [0, 0, 0, 0]; ends().forEach(([u, w]) => { sum[w] += xVal[u]; });
    anim = { vertShow: null,
      labels: p => ends().map(([u, w]) => { const [x1, y1] = endPos(u, w, FAR_F); return { x: lerp(x1, pos[w][0], p), y: lerp(y1, pos[w][1] + 8, p), v: xVal[u], op: 1 - p }; }),
      done: () => { vertVal = sum; state = "VERT"; if (mode === "mu") { t += 1; homeX = sum.map((v, i) => v / deg[i]); } } };
  }
  function frame(now) {
    const p = Math.min(1, (now - t0) / dur), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    drawGraph(e);
    if (p < 1) requestAnimationFrame(frame);
    else { const d = anim.done; anim = null; d(); render(); if (running) setTimeout(() => running && move(), 250); }
  }
  requestAnimationFrame(frame);
}
function fullStep() { if (anim) return; let k = 0; const go = () => { move(); k++; if (k < 3) setTimeout(go, 800); }; go(); }
function stop() { running = false; document.getElementById("run").textContent = "Run"; }

// ---- loop diagram (mirrors the figure) ----
function drawLoop() {
  const s = document.getElementById("loop"); s.innerHTML = "";
  const P = { VERT: [80, 75], OWN: [240, 75], SENT: [400, 75] };
  const name = { VERT: ["mass on vertices", "(red)"], OWN: ["value on own", "edge-ends (blue)"], SENT: ["value at", "far end"] };
  const home = mode === "mu" ? "VERT" : "OWN";
  const defs = el("defs", {}, s);
  const mk = el("marker", { id: "ah", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", fill: "#57534e" }, mk);
  const arrow = (d, lab, lx, ly, active) => {
    el("path", { d, fill: "none", stroke: active ? "#ea580c" : "#57534e", "stroke-width": active ? 2.6 : 1.4, "stroke-dasharray": "5 4", "marker-end": "url(#ah)" }, s);
    const tx = el("text", { x: lx, y: ly, "text-anchor": "middle", "font-size": 13.5, fill: active ? "#ea580c" : "#1c1b19", "font-weight": active ? 700 : 400 }, s); tx.innerHTML = lab;
  };
  const cur = anim ? null : MOVE_FROM[state];
  arrow("M128,62 L190,62", "D<tspan baseline-shift='super' font-size='10'>−1</tspan>", 160, 50, cur === "D");
  arrow("M288,62 L350,62", "send", 320, 50, cur === "send");
  arrow("M400,100 C400,150 80,150 80,104", "A: aggregate", 240, 127, cur === "A");
  STATES.forEach(k => {
    const [x, y] = P[k], on = k === state && !anim, isHome = k === home;
    el("rect", { x: x - 52, y: y - 24, width: 104, height: 46, rx: 8, fill: on ? "#fff7ed" : "#fff", stroke: isHome ? (mode === "mu" ? RED : BLUE) : "#d9d5cc", "stroke-width": isHome ? 2.6 : 1.2 }, s);
    name[k].forEach((line, j) => { el("text", { x, y: y - 5 + 15 * j, "text-anchor": "middle", "font-size": 12, fill: "#1c1b19" }, s).textContent = line; });
  });
  el("text", { x: P[home][0], y: 18, "text-anchor": "middle", "font-size": 11.5, fill: mode === "mu" ? RED : BLUE, "font-weight": 600 }, s).textContent =
    mode === "mu" ? "μₜ lives here" : "xₜ lives here";
}

// ---- bars: current mu_t = D x_t vs pi, and x_t vs 1/vol ----
function drawBars() {
  const s = document.getElementById("bars"); s.innerHTML = "";
  // current mu and x, whichever state we're in (mid-loop states are reported in the mode's own variable)
  // report the state at the mode's home position (last completed step), not mid-loop values
  const x = homeX, mu = homeX.map((v, i) => v * deg[i]);
  const pi = deg.map(d => d / vol);
  const panel = (x0, vals, target, color, ymax, title) => {
    const W = 210, H = 120, y0 = 140, bw = 34;
    el("line", { x1: x0, y1: y0, x2: x0 + W, y2: y0, class: "axis" }, s);
    el("text", { x: x0 + W / 2, y: 14, "text-anchor": "middle", "font-size": 12.5, fill: color, "font-weight": 600 }, s).innerHTML = title;
    vals.forEach((v, i) => {
      const cx = x0 + 22 + i * 50, h = Math.min(v, ymax) / ymax * H;
      el("rect", { x: cx, y: y0 - h, width: bw, height: h, fill: color, opacity: 0.8 }, s);
      const th = target[i] / ymax * H;
      el("line", { x1: cx - 4, x2: cx + bw + 4, y1: y0 - th, y2: y0 - th, stroke: "#1c1b19", "stroke-width": 2, "stroke-dasharray": "4 3" }, s);
      el("text", { x: cx + bw / 2, y: y0 + 15, "text-anchor": "middle", class: "tick" }, s).textContent = "v" + "₁₂₃₄"[i];
    });
  };
  const mumax = Math.max(0.45, ...mu) * 1.05, xmax = Math.max(0.25, ...x) * 1.05;
  panel(10, mu, pi, RED, mumax, "μ<tspan font-size='9' baseline-shift='sub'>t</tspan> &nbsp;(dashed: π = d/vol)");
  panel(258, x, deg.map(() => 1 / vol), BLUE, xmax, "x<tspan font-size='9' baseline-shift='sub'>t</tspan> = D<tspan font-size='9' baseline-shift='super'>−1</tspan>μ<tspan font-size='9' baseline-shift='sub'>t</tspan> &nbsp;(dashed: 1/vol)");
  return { mu, x };
}

const MOVE_TXT = {
  mu: { D: "<b>D<sup>−1</sup>: split</b> — each vertex divides its mass equally among its edges.",
        send: "<b>send</b> — each share crosses its edge.",
        A: "<b>A: aggregate</b> — each vertex collects what arrived. That completes μ<sup>⊤</sup> ↦ μ<sup>⊤</sup>D<sup>−1</sup>A = μ<sup>⊤</sup>P." },
  x:  { send: "<b>send</b> — each vertex sends a <i>copy</i> of its value along every edge.",
        A: "<b>A: aggregate</b> — each vertex sums its neighbors' values (red: A x, not yet normalized).",
        D: "<b>D<sup>−1</sup>: average</b> by degree: x ↦ D<sup>−1</sup>A x = P x. <span class='red'>The red A x<sub>t</sub> is exactly μ<sub>t+1</sub>.</span>" },
};
function render() {
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  document.getElementById("gtitle").innerHTML = mode === "mu"
    ? "Measures: the state is the <span class='red'>red mass on vertices</span>; one step = D<sup>−1</sup>, send, A"
    : "Densities: the state is the <span class='blue'>blue value at each vertex</span>; one step = send, A, D<sup>−1</sup>";
  drawGraph(1); drawLoop();
  const { mu, x } = drawBars();
  document.getElementById("moveText").innerHTML = "Next: " + MOVE_TXT[mode][MOVE_FROM[state]];
  const tv = 0.5 * mu.reduce((s, v, i) => s + Math.abs(v - deg[i] / vol), 0);
  document.getElementById("readout").innerHTML =
    `step <b>t = ${t}</b> &nbsp;·&nbsp; μ<sub>t</sub> = (${mu.map(v => fmt(v)).join(", ")}) &nbsp;·&nbsp; x<sub>t</sub> = (${x.map(v => fmt(v)).join(", ")}) &nbsp;·&nbsp; ` +
    `‖μ<sub>t</sub> − π‖<sub>TV</sub> = <b>${fmt(tv)}</b> &nbsp;·&nbsp; same loop, so always <b>μ<sub>t</sub> = D x<sub>t</sub></b>`;
}

document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => { mode = b.dataset.m; reset(); });
document.getElementById("next").onclick = move;
document.getElementById("full").onclick = fullStep;
document.getElementById("reset").onclick = reset;
document.getElementById("init").onchange = reset;
document.getElementById("run").onclick = e => {
  if (running) { stop(); return; }
  running = true; e.target.textContent = "Pause"; move();
};
reset();
</script>
</body>
</html>
